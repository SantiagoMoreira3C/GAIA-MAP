# OSIRIS SIAP - MediaMTX config
# Agrega usuario admin/admin para Larix, manteniendo acceso anónimo para HLS/lectura

logLevel: info

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof
  - user: admin
    pass: admin
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
        path:

# HLS default MediaMTX (estable en http) — sin forzar duraciones, evita 404 y saltos 403ms->9s
# Permitir CORS HLS para navegador
hlsAllowOrigins: ["*"]
webrtcAllowOrigins: ["*"]
apiAllowOrigins: ["*"]

# Paths abiertos
paths:
  all_others:

